[workspace]
resolver = "2"
members = ["crates/vtc-core", "crates/vtc-server", "crates/vtc-worker"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# --- 共享核心 ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"

# --- 认证 / 安全 ---
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
hmac = "0.12"

# --- 时间 ---
# `wasmbind`：让 `Utc::now()`/`Instant` 在 wasm32 上走 JS `performance.now()`（否则 std
# `unsupported::time` 直接 panic「time not implemented」→ CF login 1101 根因）。
# 该特性内部 `#[cfg(target_arch="wasm32")]` 门控，Docker/native 构建**完全不受影响**。
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
time = { version = "0.3", features = ["serde", "macros"] }
uuid = { version = "1", features = ["serde", "v4"] }

# --- 持久化（Docker 形态） ---
# bundled=true：libsqlite3-sys 自带 SQLite C 源码，用 cc-rs 现场编译，**不**依赖系统 libsqlite3。
# 关键原因：musl 静态链接下，系统 libsqlite3.a（Debian libtool 归档）常混入 glibc 的
# scrt1.o/crti.o 启动对象，链进 musl 二进制后 SQLite 首次调用即 SIGSEGV（code 139）。
# bundled 从根上避开——自己编 C 源码，纯 musl 工具链产物。副作用（正向）：
#   - Windows 本地构建也不再需要 prebuilt/sqlite3.lib + SQLITE3_LIB_DIR 注入（cc 直接编）。
#   - worker 形态不受影响（vtc-worker 用 D1，根本不依赖 rusqlite）。
# 前提：构建环境要有 C 编译器（Docker 里 apt 装 build-essential；Windows 用 MSVC/clang）。
rusqlite = { version = "0.32", features = ["bundled"] }
serde_urlencoded = "0.7"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# panic=abort：worker 省 wasm 体积（不生成 unwind 表）。CF 构建**手动**跑 wasm-bindgen
# （cf-build.sh，--target module），**不**用 worker-build（它强制 --force-enable-abort-handler
# 与 abort 冲突）。module target 的 index.js 自实例化 wasm，不依赖 abort-handler 恢复，
# 故 abort 安全。native（Docker axum）abort 亦 OK（panic 直接终止进程）。
panic = "abort"
